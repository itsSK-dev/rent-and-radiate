<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Security headers (meta-tag equivalents; primary headers should also be set at the edge) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(self), microphone=(self), geolocation=(self), payment=(self), interest-cohort=()" />

    <!-- Perf: preconnect to font + supabase origins to reduce render-blocking latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://zlyazcpuxzdvudrfzjxu.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://zlyazcpuxzdvudrfzjxu.supabase.co" />

    <!-- Preload the LCP hero image (responsive) so the browser starts fetching
         the correctly-sized WebP before the JS bundle mounts the carousel. -->
    <link
      rel="preload"
      as="image"
      href="/hero/hero-1.webp"
      imagesrcset="/hero/hero-1-sm.webp 800w, /hero/hero-1.webp 1600w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />

    <!-- Load Google Fonts with a non-blocking pattern so CSS doesn't stall FCP.
         `display=optional` prevents the font swap layout shift (CLS) that
         Lighthouse was flagging on the large display headline. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=optional"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=optional"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=optional"
      />
    </noscript>


    <title>Rent &amp; Radiate — Rent designer dresses &amp; jewellery</title>
    <meta name="description" content="Rent or buy designer dresses, jewellery and accessories from verified boutiques near you — refundable deposits, tracked delivery, transparent pricing." />
    <meta name="author" content="Rent & Radiate" />

    <meta property="og:site_name" content="Rent & Radiate" />
    <meta property="og:title" content="Rent &amp; Radiate — Rent designer dresses &amp; jewellery" />
    <meta property="og:description" content="Rent or buy designer dresses, jewellery and accessories from verified boutiques near you — refundable deposits and tracked delivery." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rent-and-radiate.lovable.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rent &amp; Radiate — Rent designer dresses &amp; jewellery" />
    <meta name="twitter:description" content="Rent or buy designer dresses, jewellery and accessories from verified boutiques near you." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Rent & Radiate",
        "url": "https://rent-and-radiate.lovable.app/",
        "description": "Marketplace to rent, buy and sell designer dresses, jewellery and fashion from verified boutiques."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Rent & Radiate",
        "url": "https://rent-and-radiate.lovable.app/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://rent-and-radiate.lovable.app/browse?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
